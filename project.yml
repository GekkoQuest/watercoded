# XcodeGen spec. `make generate` turns this into Watercoded.xcodeproj (which is not committed).
name: Watercoded
options:
  bundleIdPrefix: dev.watercoded
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en

configFiles:
  Debug: Configs/Debug.xcconfig
  Release: Configs/Release.xcconfig

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
  WatercodedKit:
    path: Packages/WatercodedKit

targets:
  Watercoded:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: App/Watercoded.entitlements
        buildPhase: none
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        SUFeedURL: https://github.com/GekkoQuest/watercoded/releases/latest/download/appcast.xml
        SUPublicEDKey: uLq2LpG8aR2ERR1kcpQ1NTfkl7KoSocgl+Jd5J3iGwI=
        SUEnableAutomaticChecks: true
        SUAllowsAutomaticUpdates: false
        SUVerifyUpdateBeforeExtraction: true
        SURequireSignedFeed: true
    dependencies:
      - package: Sparkle
      - package: WatercodedKit
        product: WatercodedUI
      - package: WatercodedKit
        product: Orchestrator
      - package: WatercodedKit
        product: AgentKit
      - package: WatercodedKit
        product: Meniscus
      - package: WatercodedKit
        product: ClaudeCodeProvider
      - package: WatercodedKit
        product: CodexProvider
      - package: WatercodedKit
        product: Delegation
      - package: WatercodedKit
        product: ReplayProvider
      - package: WatercodedKit
        product: OnDeviceIntelligence
      - package: WatercodedKit
        product: ProcessKit

schemes:
  Watercoded:
    build:
      targets:
        Watercoded: all
    run:
      config: Debug
    archive:
      config: Release
