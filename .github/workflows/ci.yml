name: CI

on:
  push:
    branches: [main, 'fix/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          if [ -d /Applications/Xcode_26.app ]; then sudo xcode-select -s /Applications/Xcode_26.app; fi
          xcodebuild -version
          xcodebuild -version | head -1 | grep -Eq '^Xcode (2[6-9]|[3-9][0-9])' \
            || { echo "::error::Xcode 26 or later is required"; exit 1; }
      - run: brew bundle --file=Brewfile
      - run: make lint

  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          if [ -d /Applications/Xcode_26.app ]; then sudo xcode-select -s /Applications/Xcode_26.app; fi
          xcodebuild -version
          xcodebuild -version | head -1 | grep -Eq '^Xcode (2[6-9]|[3-9][0-9])' \
            || { echo "::error::Xcode 26 or later is required"; exit 1; }
      - name: Metal Toolchain
        run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain
      - name: Test with external watchdog
        timeout-minutes: 12
        run: python3 scripts/ci-test.py
      - name: Upload test hang diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-hang-${{ github.workflow }}-${{ github.run_attempt }}
          path: .build/test-diagnostics/
          if-no-files-found: ignore

  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          if [ -d /Applications/Xcode_26.app ]; then sudo xcode-select -s /Applications/Xcode_26.app; fi
          xcodebuild -version
          xcodebuild -version | head -1 | grep -Eq '^Xcode (2[6-9]|[3-9][0-9])' \
            || { echo "::error::Xcode 26 or later is required"; exit 1; }
      - run: brew bundle --file=Brewfile
      - name: Metal Toolchain
        run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain
      - run: make build CONFIG=Release
